[package]
name = "mshop_schema"
version = "1.0.0"
edition = "2021"
description = "Product database schema (v1) and its constraint tests. No application logic lives here."

[dependencies]
sqlx = { version = "0.8", features = ["sqlite", "runtime-tokio"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }

[dev-dependencies]
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
