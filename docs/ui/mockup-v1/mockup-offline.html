<style>
/* ===== نموذج واجهة «موبايل ستور» — تصميم بس، مش كود المنتج ===== */
:root {
  --bg: #f4f6fa; --surface: #ffffff; --surface-2: #f8fafc; --surface-3: #eef2f7;
  --border: #e3e8ef; --border-strong: #cfd6e0;
  --text: #0f172a; --text-2: #334155; --muted: #64748b;
  --accent: #2563eb; --on-accent: #ffffff;
  --accent-weak: color-mix(in srgb, var(--accent) 12%, transparent);
  --accent-text: color-mix(in srgb, var(--accent) 82%, #0f172a);
  --ok: #15803d; --warn: #b45309; --danger: #dc2626;
  --shadow: 0 1px 2px rgba(15, 23, 42, .05), 0 4px 14px rgba(15, 23, 42, .05);
  --c0: #2563eb; --c1: #e60000; --c2: #6d28d9; --c3: #0d9488; --c4: #f59e0b;
  --font: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif;
  --mono: ui-monospace, 'Cascadia Mono', Consolas, 'Courier New', monospace;
}
html[data-theme="dark"] {
  --bg: #0b1220; --surface: #111a2e; --surface-2: #0f1729; --surface-3: #1b2642;
  --border: #22304d; --border-strong: #33446a;
  --text: #e6ecf6; --text-2: #c4cfe0; --muted: #8d9bb5;
  --accent-weak: color-mix(in srgb, var(--accent) 22%, transparent);
  --accent-text: color-mix(in srgb, var(--accent) 52%, #ffffff);
  --ok: #34d399; --warn: #fbbf24; --danger: #f87171;
  --shadow: 0 1px 2px rgba(0, 0, 0, .35), 0 6px 18px rgba(0, 0, 0, .22);
  color-scheme: dark;
}
html[data-font="cairo"] { --font: 'Cairo', 'Segoe UI', Tahoma, sans-serif; }
html[data-font="tajawal"] { --font: 'Tajawal', 'Segoe UI', Tahoma, sans-serif; }
html[data-font="readex"] { --font: 'Readex Pro', 'Segoe UI', Tahoma, sans-serif; }
html { font-size: 15px; }
html[data-scale="large"] { font-size: 17px; }
* { box-sizing: border-box; }
body {
  margin: 0; font-family: var(--font); background: var(--bg); color: var(--text); line-height: 1.45;
  -webkit-font-smoothing: antialiased; overflow: hidden;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
svg.i { width: 18px; height: 18px; flex: none; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.search-box input:focus-visible, .inline-search input:focus-visible, .field input:focus-visible,
.field select:focus-visible, .field textarea:focus-visible, .cat-name:focus-visible { outline: none; }
.muted { color: var(--muted); }
.ok-t { color: var(--ok); } .warn-t { color: var(--warn); } .danger-t { color: var(--danger); }
.num { font-variant-numeric: tabular-nums; }
.mono { font-family: var(--mono); letter-spacing: 0; }
.sp { flex: 1; }
.row { display: flex; align-items: center; gap: 8px; }
.row.wrap { flex-wrap: wrap; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 10px; border: 2px solid transparent; background-clip: padding-box; }

/* ===== الهيكل ===== */
.shell { display: grid; grid-template-columns: 84px minmax(0, 1fr); height: 100vh; }
.rail {
  background: var(--surface); border-inline-end: 1px solid var(--border);
  display: flex; flex-direction: column; align-items: center; padding: 12px 0 10px; gap: 4px; min-height: 0;
}
.logo {
  width: 48px; height: 48px; border-radius: 14px; background: var(--accent); color: var(--on-accent);
  display: grid; place-items: center; font-weight: 700; font-size: 1.25rem; overflow: hidden; flex: none;
}
.logo img { width: 100%; height: 100%; object-fit: cover; }
.rail .logo { margin-bottom: 10px; }
.nav-btn {
  position: relative; width: 72px; padding: 9px 4px 7px; border-radius: 12px; border: 0; background: transparent;
  color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: .74rem; font-weight: 600;
}
.nav-btn svg.i { width: 23px; height: 23px; }
.nav-btn:hover { background: var(--surface-3); color: var(--text); }
.nav-btn.active { background: var(--accent-weak); color: var(--accent-text); }
.nav-btn .lock-badge {
  position: absolute; top: 4px; inset-inline-start: 10px; width: 18px; height: 18px; border-radius: 50%;
  background: var(--surface-3); color: var(--muted); display: grid; place-items: center;
}
.nav-btn .lock-badge svg.i { width: 11px; height: 11px; }
.rail .sp { flex: 1; }
.main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
.topbar {
  height: 58px; flex: none; display: flex; align-items: center; gap: 10px; padding: 0 16px; position: relative; z-index: 30;
  background: var(--surface); border-bottom: 1px solid var(--border);
}
.topbar h1 { font-size: 1.08rem; margin: 0; font-weight: 700; white-space: nowrap; }
.topbar .shop { color: var(--muted); font-size: .85rem; white-space: nowrap; }
.status {
  display: inline-flex; align-items: center; gap: 6px; font-size: .8rem; color: var(--text-2);
  background: var(--surface-2); border: 1px solid var(--border); border-radius: 999px; padding: 4px 10px; white-space: nowrap;
}
.status svg.i { width: 15px; height: 15px; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; display: inline-block; }
.content { flex: 1; min-height: 0; overflow: auto; }

/* المستخدم فوق + قايمة التبديل */
.user-switch { position: relative; flex: none; }
.user-chip {
  display: inline-flex; align-items: center; gap: 8px; padding: 4px 10px 4px 6px; border-radius: 999px;
  border: 1px solid var(--border); background: var(--surface); text-align: start;
}
.user-chip:hover, .user-switch.open .user-chip { border-color: var(--accent); background: var(--accent-weak); }
.user-chip .who { line-height: 1.15; font-weight: 600; }
.user-chip .who small { display: block; color: var(--muted); font-size: .72rem; font-weight: 500; }
.user-chip .chev { width: 16px; height: 16px; color: var(--muted); transition: transform .15s; }
.user-switch.open .user-chip .chev { transform: rotate(180deg); }
.avatar { width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: #fff; font-weight: 700; font-size: .9rem; flex: none; }
.avatar.lg { width: 60px; height: 60px; font-size: 1.4rem; }
.sw-menu {
  position: absolute; top: calc(100% + 8px); inset-inline-end: 0; width: 276px; z-index: 40;
  background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 8px;

/* ===== أزرار وحقول ===== */
.btn {

.btn.ghost { border-color: transparent; background: transparent; }

.icon-btn {
  width: 40px; height: 40px; display: inline-grid; place-items: center; border-radius: 10px; border: 1px solid var(--border);

.icon-btn.on { border-color: var(--accent); background: var(--accent-weak); color: var(--accent-text); }
kbd {
  font-family: inherit; font-size: .72rem; line-height: 1.5; background: var(--surface-3); border: 1px solid var(--border-strong);
  border-bottom-width: 2px; border-radius: 6px; padding: 0 6px; color: var(--text-2); direction: ltr; unicode-bidi: isolate;
  font-weight: 600; white-space: nowrap;
}
.field { display: flex; flex-direction: column; gap: 6px; min-width: 0; }

.field input, .field select, .field textarea {

}

.big-in { height: 52px !important; font-size: 1.25rem; font-weight: 700; }
input[dir="ltr"] { text-align: left; }
.grid2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px; }
.stack { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.seg { display: inline-flex; background: var(--surface-3); border-radius: 12px; padding: 4px; gap: 4px; flex-wrap: wrap; max-width: 100%; }

}

.chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; flex: none; }
.chips.cats, .chips.subcats { flex-wrap: wrap; overflow: visible; }
.chip {
  border: 1px solid var(--border); background: var(--surface); border-radius: 999px; padding: 6px 14px; display: inline-flex;
  gap: 6px; align-items: center; white-space: nowrap; font-size: .88rem; font-weight: 600; color: var(--text-2);
}

.tag {
  display: inline-flex; align-items: center; gap: 4px; font-size: .74rem; padding: 1px 8px; border-radius: 999px;
  background: var(--surface-3); color: var(--text-2); white-space: nowrap; font-weight: 600;
}

  content: ''; position: absolute; top: 3px; inset-inline-start: 3px; width: 20px; height: 20px; border-radius: 50%;
  background: #fff; transition: .15s; box-shadow: 0 1px 3px rgba(0, 0, 0, .25);
}

.note {

/* ===== شاشة البيع ===== */
.pos-wrap { display: grid; grid-template-rows: minmax(0, 1fr) auto; height: 100%; }

}

}

.tiles {

}

.tiles-empty { grid-column: 1 / -1; display: grid; justify-items: center; align-content: center; gap: 6px; padding: 40px 16px; color: var(--muted); text-align: center; border: 1.5px dashed var(--border-strong); border-radius: 16px; }

.cart { display: flex; flex-direction: column; min-height: 0; background: var(--surface); border-inline-start: 1px solid var(--border); }

  border: 1px solid var(--border); background: var(--surface); font-weight: 600; font-size: .84rem; color: var(--text-2); white-space: nowrap;
}

.cust-row {

.lines { flex: 1; min-height: 0; overflow: auto; padding: 8px 12px; }
.line {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px; border-radius: 12px;
  border: 1px solid transparent; cursor: pointer; margin-bottom: 4px;

.inline-search {
  display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border: 1px solid var(--border-strong);
  border-radius: 12px; background: var(--surface); color: var(--muted); min-width: 260px;
}

}

const logoHTML = (cls = 'logo') => `<div class="${cls}">${SET.logo ? `<img src="${SET.logo}" alt="">` : esc((SET.shopName || 'م').trim().charAt(0))}</div>`;

/* سجلات تتملي من الملفات التانية */
const VIEWS = {}, MODALS = {}, ACT = {}, INPUT = {}, CHANGE = {};

/* ===== الرسم ===== */
function render() {
  const app = $('#app');
  const ae = document.activeElement;
  const fid = ae && ae !== document.body && ae.id ? ae.id : null;
  let s0 = null, s1 = null;
  if (fid && typeof ae.selectionStart === 'number') { s0 = ae.selectionStart; s1 = ae.selectionEnd; }
  const scrolls = {};
  $$('[data-scroll]').forEach((el) => { scrolls[el.dataset.scroll] = [el.scrollTop, el.scrollLeft]; });

  app.innerHTML = S.locked ? viewLock() : shell() + (S.modal ? modalHTML() : '');
  document.body.classList.toggle('has-modal', !!S.modal || S.locked);

  $$('[data-scroll]').forEach((el) => { const v = scrolls[el.dataset.scroll]; if (v) { el.scrollTop = v[0]; el.scrollLeft = v[1]; } });
  if (S.modal && !S.locked && !S.modal._mounted) {
    S.modal._mounted = true;
    const af = $('.modal [data-autofocus]');
    if (af) { af.focus({ preventScroll: true }); if (af.select) af.select(); }
  } else if (fid) {
    const el = document.getElementById(fid);
    if (el) {
      el.focus({ preventScroll: true });
      if (s0 !== null && el.setSelectionRange) { try { el.setSelectionRange(s0, s1); } catch { /* نوع الحقل مش بيدعم */ } }
    }
  }
  if (!S.modal && !S.locked && !(S.sw && S.sw.user) && S.view === 'pos' && (!document.activeElement || document.activeElement === document.body)) focusSearch();
  if (S._scrollSel) { const sel = $('.line.sel'); if (sel) sel.scrollIntoView({ block: 'nearest' }); S._scrollSel = false; }
}
function focusSearch() { const q = $('#q'); if (q && !S.modal && !S.locked && !(S.sw && S.sw.user)) q.focus({ preventScroll: true }); }
function openModal(m) { S.sw = null; S.modal = m; render(); }
function closeModal() {
  const prev = S.modal && S.modal.prev;
  if (prev) { prev._mounted = false; S.modal = prev; render(); return; }
  S.modal = null; render(); focusSearch();
}
function modalHTML() { const def = MODALS[S.modal.type]; return def ? `<div class="overlay" data-act="overlay">${def.html(S.modal)}</div>` : ''; }
const modalHead = (ic, title, sub = '') => `<div class="modal-h"><h3>${icon(ic)} <span class="mt">${title}</span>${sub ? ` <small>${sub}</small>` : ''}</h3><button type="button" class="icon-btn sm" data-act="closeModal" title="إغلاق (Esc)">${icon('x')}</button></div>`;

/* ===== الهيكل: الشريط الجانبي والعلوي ===== */
const NAV = [
  { id: 'pos', label: 'البيع', icon: 'shopping-cart' },
  { id: 'repairs', label: 'الصيانة', icon: 'wrench' },
  { id: 'inventory', label: 'المخزون', icon: 'boxes' },
  { id: 'dashboard', label: 'التقارير', icon: 'chart-column', owner: true },
  { id: 'mobile', label: 'الموبايل', icon: 'smartphone' },
  { id: 'settings', label: 'الإعدادات', icon: 'settings', owner: true },
];
const TITLES = { pos: 'البيع', repairs: 'الصيانة', inventory: 'المخزون', dashboard: 'التقارير', mobile: 'تطبيق الموبايل', settings: 'الإعدادات' };
function shell() {
  return `<div class="shell">${rail()}<main class="main">${topbar()}<div class="content" data-scroll="content-${S.view}">${VIEWS[S.view]()}</div></main></div>`;
}
function rail() {
  const dark = curTheme() === 'dark';
  return `<nav class="rail" aria-label="الأقسام">
    ${logoHTML()}
    ${NAV.map((n) => {
      const locked = n.owner && !isOwner();
      return `<button type="button" class="nav-btn ${S.view === n.id ? 'active' : ''}" data-act="nav" data-v="${n.id}" title="${n.label}${locked ? ' — للمالك بس' : ''}">${icon(n.icon)}<span>${n.label}</span>${locked ? `<span class="lock-badge">${icon('lock')}</span>` : ''}</button>`;
    }).join('')}
    <div class="sp"></div>
    <button type="button" class="nav-btn" data-act="toggleTheme" title="فاتح / غامق">${icon(dark ? 'sun' : 'moon')}<span>${dark ? 'فاتح' : 'غامق'}</span></button>
    <button type="button" class="nav-btn" data-act="lock" title="قفل الشاشة (Ctrl+L)">${icon('lock-keyhole')}<span>قفل</span></button>
  </nav>`;
}
function topbar() {
  const u = S.user;
  return `<header class="topbar">
    <h1>${TITLES[S.view]}</h1><span class="shop hide-sm">· ${esc(SET.shopName)}</span>
    <div class="sp"></div>
    <span class="status" title="الوردية">${icon('clock')} وردية #${num(DATA.shift.no)} مفتوحة · من ${dg(DATA.shift.opened)}</span>
    <span class="status hide-sm" title="الطابعة"><span class="dot"></span>${icon('printer')} الطابعة جاهزة</span>
    <span class="status hide-sm" title="الموبايلات المتصلة بشبكة المحل"><span class="dot"></span>${icon('smartphone')} ${num(DATA.devices.filter((d) => d.online).length)} موبايل متصل</span>
    <span class="status num" id="clock">${fmtTime()}</span>
    <button type="button" class="btn sm" data-act="shiftClose">${icon('calculator')} تقفيل الوردية</button>
    <div class="user-switch ${S.sw ? 'open' : ''}">
      <button type="button" class="user-chip" data-act="swToggle" aria-haspopup="true" aria-expanded="${S.sw ? 'true' : 'false'}" title="بدّل البيّاع">${avatar(u)}<span class="who">${esc(u.name)}<small>${roleName(u)}</small></span>${icon('chevron-down', 'chev')}</button>
      ${S.sw ? swMenuHTML() : ''}
    </div>
  </header>`;
}

/* ===== تبديل البيّاع من فوق: تأشّر على اسمك ← تظهر باقي الأسماء ← تختار ← الرقم السري بتاعه ===== */
function swMenuHTML() {
  const sw = S.sw, me = S.user;
  if (!sw.user) {
    const others = DATA.users.filter((x) => x.id !== me.id);
    return `<div class="sw-menu" role="menu" aria-label="تبديل البيّاع">
      <div class="sw-cur">${avatar(me)}<span class="t"><b>${esc(me.name)}</b><small>${roleName(me)} · شغّال دلوقتي</small></span></div>
      <div class="sw-h">بدّل لـ</div>
      ${others.map((x) => `<button type="button" class="sw-item" role="menuitem" data-act="swPick" data-id="${x.id}">${avatar(x)}<span class="t"><b>${esc(x.name)}</b><small>${roleName(x)}</small></span>${icon('chevron-left')}</button>`).join('')}
      <div class="sw-sep"></div>
      <button type="button" class="sw-item sm" role="menuitem" data-act="lock">${icon('lock-keyhole')}<span class="t">قفل الشاشة</span><kbd>Ctrl+L</kbd></button>
    </div>`;
  }
  const x = sw.user;
  return `<div class="sw-menu pin ${sw.err ? 'shake' : ''}" role="dialog" aria-label="الرقم السري">
    <div class="sw-pin-h"><button type="button" class="icon-btn sm" data-act="swBack" title="رجوع (Esc)">${icon('arrow-right')}</button>${avatar(x)}<span class="t"><b>${esc(x.name)}</b><small>اكتب الرقم السري بتاعه</small></span></div>
    <div class="pin-dots sm">${[0, 1, 2, 3].map((i) => `<i class="${i < sw.pin.length ? 'on' : ''}"></i>`).join('')}</div>
    <div class="err-msg">${esc(sw.err)}</div>
    <div class="numpad sm">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-act="swKey" data-k="${n}">${num(n)}</button>`).join('')}
      <button type="button" data-act="swBack" title="رجوع">${icon('arrow-right')}</button>
      <button type="button" data-act="swKey" data-k="0">${num(0)}</button>
      <button type="button" data-act="swKey" data-k="del" title="مسح">${icon('delete')}</button></div>
    <div class="sw-hint">للتجربة: ${esc(x.name)} <bdi dir="ltr" class="mono">${x.pin}</bdi></div>
  </div>`;
}
// القايمة بتتحدّث لوحدها من غير ما الشاشة كلها تترسم تاني — عشان أي ضغطة برّه (زرار أو مفتاح تشغيل) تكمّل عادي
function swSync() {
  const w = $('.user-switch'); if (!w) return;
  w.classList.toggle('open', !!S.sw);
  const old = w.querySelector('.sw-menu'); if (old) old.remove();
  if (S.sw) w.insertAdjacentHTML('beforeend', swMenuHTML());
  const c = w.querySelector('.user-chip'); if (c) c.setAttribute('aria-expanded', S.sw ? 'true' : 'false');
}
let swHoverBlock = false; // بعد التبديل أو القفل: متفتحش تاني بالتأشير لحد ما الماوس يبعد
function swOpen(pinned = false) { S.sw = { user: null, pin: '', err: '', pinned }; swSync(); }
function swClose() { if (!S.sw) return; const wasPin = !!S.sw.user; S.sw = null; swHoverBlock = true; swSync(); if (wasPin) focusSearch(); }
function swPick(u) {
  if (!u || u.id === S.user.id) return;
  S.sw = { user: u, pin: '', err: '', pinned: true };
  const ae = document.activeElement; if (ae && ae !== document.body && ae.blur) ae.blur();
  swSync();
}
function swPress(k) {
  const sw = S.sw; if (!sw || !sw.user) return;
  if (k === 'del') { sw.pin = sw.pin.slice(0, -1); sw.err = ''; swSync(); return; }
  if (sw.pin.length >= 4) return;
  sw.pin += k; sw.err = '';
  if (sw.pin.length === 4) {
    if (sw.pin === sw.user.pin) { switchUser(sw.user); return; }
    sw.err = 'الرقم السري غلط — جرّب تاني'; sw.pin = ''; beep();
  }
  swSync();
}
function switchUser(u) {
  const keep = cur().lines.length;
  S.user = u; S.sw = null; swHoverBlock = true;
  const n = NAV.find((x) => x.id === S.view);
  if (n && n.owner && u.role !== 'owner') S.view = 'pos';
  render(); focusSearch();
  toast(`بقيت شغّال باسم ${u.name}${keep ? ' — الفاتورة المفتوحة زي ما هي' : ''}`);
}
// بيرجّع true لو الزرار اتعامل معاه هنا
function swKey(e) {
  const sw = S.sw;
  if (!sw.user) { if (e.key === 'Escape') { e.preventDefault(); swClose(); return true; } return false; }
  const d = toLatin(e.key);
  if (/^[0-9]$/.test(d)) { e.preventDefault(); swPress(d); return true; }
  if (e.key === 'Backspace') { e.preventDefault(); swPress('del'); return true; }
  if (e.key === 'Escape') { e.preventDefault(); S.sw = { user: null, pin: '', err: '', pinned: true }; swSync(); return true; }
  return true; // وانت بتكتب الرقم السري، باقي الزراير متتبعتش لشاشة البيع
}
Object.assign(ACT, {
  swToggle: () => { if (!S.sw) swOpen(true); else if (!S.sw.pinned) { S.sw.pinned = true; } else swClose(); },
  swPick: (d) => swPick(DATA.users.find((x) => x.id === d.id)),
  swKey: (d) => swPress(d.k),
  swBack: () => { S.sw = { user: null, pin: '', err: '', pinned: true }; swSync(); },
});
// فتح بالتأشير (بعد لحظة صغيرة عشان مايفتحش لو الماوس معدّي) وقفل لما الماوس يبعد — إلا لو بتكتب الرقم السري.
// الفتح بيحتاج حركة ماوس حقيقية (mousemove): لما الشاشة تترسم تاني والماوس واقف على الاسم، المتصفح بيبعت
// mouseover لوحده — ده مايفتحش القايمة وانت شغّال بالكيبورد.
let swOpenT = 0, swCloseT = 0;
function swHover(e) {
  const inside = !!(e.target.closest && e.target.closest('.user-switch'));
  if (inside) {
    clearTimeout(swCloseT); swCloseT = 0;
    if (e.type === 'mousemove' && !S.sw && !swOpenT && !swHoverBlock && !S.modal && !S.locked) {
      swOpenT = setTimeout(() => { swOpenT = 0; if (!S.sw && !swHoverBlock && !S.modal && !S.locked) swOpen(false); }, 140);
    }
  } else {
    swHoverBlock = false;
    if (swOpenT) { clearTimeout(swOpenT); swOpenT = 0; }
    if (S.sw && !S.sw.user && !S.sw.pinned && !swCloseT) {
      swCloseT = setTimeout(() => { swCloseT = 0; if (S.sw && !S.sw.user && !S.sw.pinned) { S.sw = null; swSync(); } }, 320);
    }
  }
}
document.addEventListener('mouseover', swHover);
document.addEventListener('mousemove', swHover);

/* ===== أفعال عامة ===== */
ACT.nav = (d) => {
  const n = NAV.find((x) => x.id === d.v);
  if (n.owner && !isOwner()) { toast('الصفحة دي للمالك بس — بدّل لحساب المالك من فوق', 'err'); beep(); return; }
  S.view = d.v; S.modal = null; render();
};
ACT.toggleTheme = () => { SET.theme = curTheme() === 'dark' ? 'light' : 'dark'; saveSettings(); applySettings(); render(); };
ACT.lock = () => { S.locked = true; S.lockUser = null; S.pin = ''; S.pinErr = ''; S.modal = null; S.sw = null; render(); };
ACT.closeModal = () => closeModal();
ACT.overlay = (d, el, e) => {
  if (e.target !== el) return;
  if (S.modal.type === 'pay' && S.modal.step === 'done') finishAfterSale(); else closeModal();
};
ACT.soon = () => toast('دي للعرض بس في النموذج', 'info');

/* ===== الأحداث ===== */
document.addEventListener('click', (e) => {
  if (S.sw && !e.target.closest('.user-switch')) { S.sw = null; swSync(); } // ضغطة برّه قايمة البيّاعين بتقفلها (من غير ما تبوّظ الضغطة نفسها)
  const el = e.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el.dataset, el, e);
});
document.addEventListener('input', (e) => { const el = e.target.closest('[data-input]'); if (el && INPUT[el.dataset.input]) INPUT[el.dataset.input](el, e); });
document.addEventListener('change', (e) => { const el = e.target.closest('[data-change]'); if (el && CHANGE[el.dataset.change]) CHANGE[el.dataset.change](el, e); });
document.addEventListener('keydown', (e) => {
  if (S.locked) { lockKey(e); return; }
  if ((e.ctrlKey || e.metaKey) && e.code === 'KeyL') { e.preventDefault(); ACT.lock(); return; }
  if (S.sw && swKey(e)) return;
  if (S.modal) { modalKey(e); return; }
  if (S.view === 'pos') posKey(e);
});
setInterval(() => { const c = $('#clock'); if (c) c.textContent = fmtTime(); }, 15000);
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => { if (SET.theme === 'auto') { applySettings(); render(); } });

</script>
<script>/* pos.js */
'use strict';
/* ===== البحث الذكي: توحيد الحروف والأرقام + كلمات مفتاحية + آخر أرقام الـ IMEI ===== */
function normalize(s) {
  return toLatin(String(s ?? '').toLowerCase())
    .replace(/[\u064B-\u0652\u0670\u0640]/g, '')
    .replace(/[أإآٱ]/g, 'ا').replace(/ة/g, 'ه').replace(/ى/g, 'ي').replace(/ؤ/g, 'و').replace(/ئ/g, 'ي')
    .replace(/\s+/g, ' ').trim();
}
/* ===== التصنيفات: رئيسية + فرعية (من الإعدادات) ===== */
const catById = (id) => SET.cats.find((c) => c.id === id);
const catName = (id) => (catById(id) || {}).name || '';
const mainOf = (id) => { const c = catById(id); return c && c.parent ? c.parent : id; };
const catFull = (id) => { const c = catById(id); return !c ? '' : c.parent ? `${catName(c.parent)} · ${c.name}` : c.name; };
const mainCats = () => SET.cats.filter((c) => !c.parent && !c.hidden);
const subCats = (mainId) => SET.cats.filter((c) => c.parent === mainId && !c.hidden);
const inCat = (p, id) => p.cat === id || mainOf(p.cat) === id;
const catCount = (id) => DATA.products.filter((p) => inCat(p, id)).length;
const catVisible = (id) => { const c = catById(id); return !!c && !c.hidden && (!c.parent || !(catById(c.parent) || {}).hidden); };
// اسم التصنيف (والرئيسي بتاعه) داخل في البحث: «اكسسوار» بتجيب كل الإكسسوارات
function indexProducts() { DATA.products.forEach((p) => { p._hay = normalize([p.name, p.kw, p.sku, catFull(p.cat)].join(' ')); p._nn = normalize(p.name); }); }
indexProducts();
// شريط التصنيفات: صف رئيسي، وتحته الفرعي بتاع التصنيف المختار (لو ليه فرعي)
function catChipsHTML(sel, act) {
  const fixed = act === 'cat' ? [{ id: 'top', name: 'الأكثر مبيعًا', icon: 'flame' }, { id: 'all', name: 'الكل', icon: 'layout-grid' }] : [{ id: 'all', name: 'الكل', icon: 'layout-grid' }];
  const selMain = sel === 'top' || sel === 'all' ? null : mainOf(sel);
  const chip = (c, on, n, cls = '') => `<button type="button" class="chip ${cls} ${on ? 'on' : ''}" data-act="${act}" data-id="${c.id}">${icon(c.icon)}<bdi dir="rtl">${esc(c.name)}</bdi>${n != null ? `<span class="cnt num">${num(n)}</span>` : ''}</button>`;
  const subs = selMain ? subCats(selMain) : [];
  return `<div class="chips cats">${fixed.map((c) => chip(c, sel === c.id)).join('')}${mainCats().map((c) => chip(c, selMain === c.id, catCount(c.id))).join('')}</div>`
    + (subs.length ? `<div class="chips subcats" aria-label="أقسام ${esc(catName(selMain))}">${subs.map((c) => chip(c, sel === c.id, catCount(c.id), 'sub')).join('')}</div>` : '');
}
const prod = (id) => DATA.products.find((p) => p.id === id);
const inAnyCart = (imei) => S.invoices.some((inv) => inv.lines.some((l) => l.imei === imei));
/* المخزون: p.stock = كل الأجهزة. منهم اللي متسجّل له IMEI (units) واللي اتسلّم بالعدد من غير IMEI */
const imeiRequired = () => SET.imeiMode === 'required';
const unitsIn = (pid) => DATA.units.filter((u) => u.pid === pid && u.status === 'in');
const unitsFree = (pid) => unitsIn(pid).filter((u) => !inAnyCart(u.imei));
const unitLines = (pid) => S.invoices.reduce((a, inv) => a + inv.lines.filter((l) => l.kind === 'unit' && l.pid === pid).length, 0);
const stockOf = (p) => (p.serial ? Math.max(0, p.stock - unitLines(p.id)) : p.stock);
const avgCost = (p) => { const us = unitsIn(p.id); return us.length ? Math.round(us.reduce((a, u) => a + u.cost, 0) / us.length) : p.cost; };
const warrantyOf = (p) => (p.cat === 'used' ? +SET.warrantyUsed : p.cat === 'phones' ? +SET.warrantyNew : p.warranty);
const luhnOk = (s) => /^\d{15}$/.test(s) && DATA.luhnDigit(s.slice(0, 14)) === s[14];
const imeiHTML = (imei) => `<bdi dir="ltr" class="mono">${imei.slice(0, -4)}<b>${imei.slice(-4)}</b></bdi>`;
const methodName = (id) => (DATA.payMethods.find((x) => x.id === id) || {}).name || id;
const methodIcon = (id) => (DATA.payMethods.find((x) => x.id === id) || {}).icon || 'wallet';
const payName = (p) => methodName(p.method) + (p.provider ? ` · ${p.provider}` : '');
const payLabel = (ps) => ps.map(payName).join(' + ');

function searchAll(q) {
  const qn = normalize(q);
  if (!qn) return [];
  const out = [];
  const digits = qn.replace(/\s/g, '');
  if (/^\d{4,15}$/.test(digits)) {
    DATA.units.filter((u) => u.status === 'in' && !inAnyCart(u.imei) &&
      (u.imei.endsWith(digits) || (u.imei2 && u.imei2.endsWith(digits)) || (digits.length >= 8 && (u.imei.includes(digits) || (u.imei2 && u.imei2.includes(digits))))))
      .slice(0, 6).forEach((u) => out.push({ type: 'unit', u, p: prod(u.pid) }));
    DATA.products.filter((p) => p.sku && p.sku.includes(digits)).slice(0, 4).forEach((p) => out.push({ type: 'prod', p }));
    if (out.length) return out;
  }
  const toks = qn.split(' ');
  const scored = [];
  for (const p of DATA.products) {
    if (!toks.every((t) => p._hay.includes(t))) continue;
    let sc = p.sold;
    if (p._nn.startsWith(toks[0])) sc += 1000;
    if (p._nn.includes(qn)) sc += 500;
    scored.push([sc, p]);
  }
  scored.sort((a, b) => b[0] - a[0]);
  return scored.slice(0, 8).map(([, p]) => ({ type: 'prod', p }));
}
function resultsHTML() {
  if (!S.q.trim()) return '';
  const res = S._res || [];
  if (!res.length) return `<div class="results"><div class="no-res">${icon('search')} مفيش نتيجة لـ «${esc(S.q)}» — ${dg('جرّب جزء من الاسم أو آخر 4 أرقام من الـ IMEI')}</div></div>`;
  return `<div class="results" data-scroll="results">${res.map((r, i) => resultRow(r, i)).join('')}</div>`;
}
function resultRow(r, i) {
  const on = i === S.qi ? ' on' : '';
  const enter = on ? '<span class="enter"><kbd>Enter</kbd></span>' : '';
  if (r.type === 'unit') {
    const { u, p } = r;
    return `<div class="result${on}" data-act="pickRes" data-i="${i}"><div class="ico">${icon('scan-barcode')}</div>
      <div class="t"><div class="n"><bdi dir="rtl">${esc(p.name)}</bdi></div>

function posKey(e) {
  const k = e.key, ae = document.activeElement;
  const inSearch = ae && ae.id === 'q';
  const typing = !inSearch && ae && /^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName);
  const fk = { F2: openQty, F3: openDiscount, F4: () => openCustomer(), F8: holdInvoice, F9: openServices, F12: openPay };
  if (fk[k]) { e.preventDefault(); fk[k](); return; }
  if (k === 'Enter' && (e.ctrlKey || e.metaKey)) { e.preventDefault(); openPay(); return; }
  if (typing) return;
  if (k === '/' && !inSearch) { e.preventDefault(); focusSearch(); return; }
  const hasQ = S.q.trim() !== '';
  if (k === 'ArrowDown' || k === 'ArrowUp') {
    e.preventDefault();
    if (hasQ && S._res.length) { S.qi = clamp(S.qi + (k === 'ArrowDown' ? 1 : -1), 0, S._res.length - 1); refreshResults(); }
    else moveSel(k === 'ArrowDown' ? 1 : -1);
    return;
  }
  if (k === 'Enter') {
    e.preventDefault();
    if (hasQ) { if (S._res.length) pickResult(S.qi); else notFound(); }
    else if (cur().lines.length) openPay();
    return;
  }
  if (k === 'Escape') { if (hasQ) clearSearch(); else if (S.sel >= 0) { S.sel = -1; render(); } return; }
  if (!hasQ) {
    if (k === 'Delete') { e.preventDefault(); removeLine(); return; }
    if (k === '+') { e.preventDefault(); changeQty(1); return; }
    if (k === '-' || k === '−') { e.preventDefault(); changeQty(-1); return; }
  }
  if (!inSearch && k.length === 1 && !e.ctrlKey && !e.metaKey && !e.altKey) focusSearch();
}
function listKey(e, m) {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') { e.preventDefault(); m.hi = Math.max(0, (m.hi || 0) + (e.key === 'ArrowDown' ? 1 : -1)); render(); return true; }
  return false;
}
function modalKey(e) {
  const m = S.modal, k = e.key, def = MODALS[m.type];
  if (k === 'Escape') { e.preventDefault(); if (m.type === 'pay' && m.step === 'done') finishAfterSale(); else closeModal(); return; }
  if (/^F([1-9]|1[0-2])$/.test(k) && k !== 'F5') e.preventDefault();
  if (def.key && def.key(e, m) === true) return;
  if (k === 'Enter' && !e.isComposing && e.target.tagName !== 'TEXTAREA') { e.preventDefault(); if (def.enter) def.enter(m, e); }
}

function openImeiPicker(p, attach = null) { openModal({ type: 'imei', pid: p.id, f: '', hi: 0, attach }); }
function imeiUnits(m) { const f = toLatin(m.f).replace(/\D/g, ''); return unitsFree(m.pid).filter((u) => !f || u.imei.includes(f) || (u.imei2 && u.imei2.includes(f))); }
// IMEI كامل (15 رقم) مكتوب ومش في القايمة: جهاز اتسلّم بالعدد من غير IMEI → يتسجّل دلوقتي
function newImeiState(m) {

  if (m.method === 'cash' && c.short) { m.err = `المبلغ أقل من المطلوب بـ ${money(c.short)} — كمّل أو اعمل دفع جزئي`; beep(); render(); return; }
  if (m.method !== 'cash' && c.canPartial) { payPartial(); return; }

  const last = { method: m.method, amount: c.remaining, provider: m.method === 'install' ? m.provider : null };
  if (m.method === 'cash') last.received = isNaN(c.v) ? c.remaining : c.v;
  const payments = c.remaining > 0 || !m.payments.length ? [...m.payments, last] : m.payments;

}
function exactCash() {
  const inv = cur(); if (!inv.lines.length) return;
  const t = totals(inv);
  const mode = (SET.receiptMode === 'wa' || SET.receiptMode === 'both') && !inv.customer ? 'print' : SET.receiptMode;
  S.sw = null;
  S.modal = { type: 'pay', step: 'pay', method: 'cash', payments: [], amount: '', provider: 'valU', receipt: mode, wa: inv.customer ? inv.customer.phone : '', err: '' };
  completeSale([{ method: 'cash', amount: t.total, received: t.total }], 0, mode, S.modal.wa);

function completeSale(payments, change, receiptMode, wa) {
  const inv = cur(), t = totals(inv);
  const sale = { no: S.nextNo++, at: new Date(), seller: S.user, customer: inv.customer, lines: inv.lines.map((l) => ({ ...l })), ...t, discount: inv.discount, payments, change, receiptMode, wa };
  for (const l of inv.lines) {
    if (l.kind === 'unit') {
      const p = prod(l.pid);
      if (l.imei) { const u = DATA.units.find((x) => x.imei === l.imei); if (u) u.status = 'sold'; }
      p.stock = Math.max(0, p.stock - 1); p.sold += 1;
      // اتباع من غير IMEI والمتسجّل بقى أكتر من اللي فاضل: أقدم جهاز متسجّل بيتشال من الحساب (الأقدم الأول)
      const reg = unitsIn(p.id);
      if (reg.length > p.stock) { const old = reg.filter((u) => !inAnyCart(u.imei)).sort((x, y) => x.received.localeCompare(y.received))[0]; if (old) { old.status = 'sold'; old.auto = true; } }
    } else if (l.kind === 'item') { const p = prod(l.pid); p.stock = Math.max(0, p.stock - l.qty); p.sold += l.qty; }
    if (l.repairNo) { const r = S.repairs.find((x) => x.no === l.repairNo); if (r) r.status = 'delivered'; }
  }
  const credit = payments.filter((p) => p.method === 'credit').reduce((a, p) => a + p.amount, 0);
  if (credit && inv.customer) inv.customer.balance += credit;
  if (inv.customer) inv.customer.visits++;
  const d = DATA.dash.today;
  d.sales += t.total; d.invoices++; d.profit += t.profit; DATA.dash.week[6] += t.total;
  d.bySeller[S.user.id] = (d.bySeller[S.user.id] || 0) + t.total; d.countBySeller[S.user.id] = (d.countBySeller[S.user.id] || 0) + 1;
  DATA.shift.cashSales += payments.filter((p) => p.method === 'cash').reduce((a, p) => a + p.amount, 0);
  DATA.dash.recent.unshift({ no: sale.no, at: fmtTime(sale.at), seller: S.user.name, sellerId: S.user.id, customer: inv.customer ? inv.customer.name : 'نقدي', method: payLabel(payments), total: t.total, fresh: true });
  S.sales.push(sale);
  Object.assign(S.modal, { step: 'done', sale, err: '', _mounted: false });
  render();
  if (receiptMode === 'print' || receiptMode === 'both') toast(`بيطبع الإيصال رقم ${sale.no} (كصورة عشان العربي يطلع مظبوط)`, 'info');

}

function stockValue(p) {
  if (!p.serial) return p.cost * p.stock;
  const reg = unitsIn(p.id);
  return reg.reduce((a, u) => a + u.cost, 0) + Math.max(0, p.stock - reg.length) * p.cost;
}
function invRow(p, own) {

    <td>${p.sku ? `<bdi dir="ltr" class="mono">${p.sku}</bdi>` : p.serial ? `<span class="muted">${imeiRequired() ? 'IMEI لكل جهاز' : 'IMEI اختياري'}</span>` : '—'}</td>
    <td class="num">${money(p.price)}</td>
    ${own ? `<td class="num">${money(avg)}${p.serial ? ' <small class="muted">متوسط</small>' : ''}</td><td class="num">${num(margin)}%</td>` : ''}

    if (unreg) html += `<tr class="sub"><td colspan="${own ? 8 : 6}"><span class="tag">${icon('hash')} ${num(unreg)} جهاز اتسلموا بالعدد من غير IMEI</span> <span class="muted">— الـ IMEI بتاعهم ممكن يتسجّل وقت البيع</span></td></tr>`;
  }
  return html;
}
function viewInventory() {

  const qd = toLatin(I.q).replace(/\D/g, '');

// صورة الصنف: بتتقص مربع وتتصغّر لـ 192 بكسل (JPEG) — حوالي 10–20 ك.ب
function shrinkImage(file, cb) {
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const S2 = 192, side = Math.min(img.width, img.height), c = document.createElement('canvas');
      c.width = S2; c.height = S2;
      const g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, S2, S2);
      g.drawImage(img, (img.width - side) / 2, (img.height - side) / 2, side, side, 0, 0, S2, S2);
      cb(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = () => toast('الملف ده مش صورة', 'err');
    img.src = rd.result;
  };
  rd.readAsDataURL(file);
}
CHANGE.imgFile = (el) => {
  const f = el.files && el.files[0], pid = S._imgFor; el.value = '';
  if (!f || !pid) return;
  shrinkImage(f, (url) => {
    const prev = IMGS[pid]; IMGS[pid] = url;
    if (saveImages()) { render(); toast(`اتحفظت صورة «${prod(pid).name}» (${num(Math.round((url.length * 3) / 4 / 1024))} ك.ب)`); } else { if (prev) IMGS[pid] = prev; else delete IMGS[pid]; }
  });
};

CHANGE.logo = (el) => {
  const f = el.files && el.files[0]; if (!f) return;
  const rd = new FileReader();
  rd.onload = () => {
    const img = new Image();
    img.onload = () => {
      const s = Math.min(1, 256 / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.max(1, Math.round(img.width * s)); c.height = Math.max(1, Math.round(img.height * s));
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      const prev = SET.logo; SET.logo = c.toDataURL('image/png');
      if (saveSettings()) { render(); toast('اتحفظ اللوجو'); } else { SET.logo = prev; }
    };
    img.onerror = () => toast('الملف ده مش صورة', 'err');
    img.src = rd.result;
  };
  rd.readAsDataURL(f);
};

       <div class="err-msg">${esc(S.pinErr)}</div>
       <div class="numpad">${[1, 2, 3, 4, 5, 6, 7, 8, 9].map((n) => `<button type="button" data-act="pinKey" data-k="${n}">${num(n)}</button>`).join('')}
         <button type="button" data-act="lockBack" title="رجوع (Esc)">${icon('arrow-right')}</button>
         <button type="button" data-act="pinKey" data-k="0">${num(0)}</button>
         <button type="button" data-act="pinKey" data-k="del" title="مسح">${icon('delete')}</button></div>`;
  return `<div class="lock"><div class="lock-card ${S.pinErr ? 'shake' : ''}">
    ${logoHTML()}<h2>${esc(SET.shopName)}</h2>${body}
    <div class="demo-hint">للتجربة بس: ${DATA.users.map((x) => `${esc(x.name)} <bdi dir="ltr" class="mono">${x.pin}</bdi>`).join(' · ')}</div>
  </div></div>`;
}
function digitFromKey(e) {
  if (/^Digit[0-9]$/.test(e.code)) return +e.code.slice(5);
  if (/^Numpad[0-9]$/.test(e.code)) return +e.code.slice(6);
  const t = toLatin(e.key);
  return /^[0-9]$/.test(t) ? +t : null;
}
function lockKey(e) {
  const d = digitFromKey(e);
  if (!S.lockUser) { if (d && d <= DATA.users.length) { e.preventDefault(); S.lockUser = DATA.users[d - 1]; render(); } return; }
  if (d !== null) { e.preventDefault(); pinPress(String(d)); return; }
  if (e.key === 'Backspace') { e.preventDefault(); pinPress('del'); return; }
  if (e.key === 'Escape') { S.lockUser = null; S.pin = ''; S.pinErr = ''; render(); }
}
function pinPress(k) {
  if (!S.lockUser) return;
  if (k === 'del') { S.pin = S.pin.slice(0, -1); S.pinErr = ''; render(); return; }
  if (S.pin.length >= 4) return;
  S.pin += k; S.pinErr = '';
  if (S.pin.length === 4) {
    if (S.pin === S.lockUser.pin) { unlockAs(S.lockUser); return; }
    S.pinErr = 'الـ PIN غلط — جرّب تاني'; S.pin = ''; beep();
  }
  render();
}
function unlockAs(u) {
  Object.assign(S, { user: u, locked: false, lockUser: null, pin: '', pinErr: '' });
  const n = NAV.find((x) => x.id === S.view);
  if (n && n.owner && u.role !== 'owner') S.view = 'pos';
  render(); focusSearch(); toast(`أهلاً يا ${u.name}`);
}
Object.assign(ACT, {
  lockPick: (d) => { S.lockUser = DATA.users.find((u) => u.id === d.id); S.pin = ''; S.pinErr = ''; render(); },
  pinKey: (d) => pinPress(d.k),
  lockBack: () => { S.lockUser = null; S.pin = ''; S.pinErr = ''; render(); },
});

      ${phoneFrame('استلام بضاعة', 'package-plus', 'بالـ IMEI (تمسح العلب) أو بالعدد من غير IMEI — زي ما يناسبك', recvScreen())}
    </div>
    <div class="note phones-note">${icon('wifi')} ده شغال طول ما الموبايل على Wi-Fi المحل، من غير إنترنت. متابعة المبيعات من برّه المحل (من البيت مثلًا) محتاجة مزامنة على الإنترنت — مرحلة جاية في الخطة.</div>
  </div>`;
}
VIEWS.mobile = viewMobile;
INPUT.mLook = (el) => { S.mobile.lookupQ = el.value; render(); };
Object.assign(ACT, {
  mScan: () => {
    const free = DATA.units.filter((u) => u.status === 'in' && !inAnyCart(u.imei) && stockOf(prod(u.pid)) > 0);
    if (!free.length) { toast('مفيش أجهزة متاحة', 'err'); return; }
    const u = free[Math.floor(Math.random() * free.length)];
    S.mobile.last = { name: prod(u.pid).name, imei: u.imei };
    addUnit(u);
  },
  mScanAcc: () => {
    const acc = DATA.products.filter((p) => !p.serial && p.stock > 0);
    const p = acc[Math.floor(Math.random() * acc.length)];
    S.mobile.last = { name: p.name };
    addItem(p); toast(`اتضاف ${p.name} من الموبايل لفاتورة الكاشير`);
  },
  mRecvMode: (d) => { S.mobile.recvMode = d.id === 'qty' ? 'qty' : 'imei'; render(); },
  mRecvQty: (d) => { S.mobile.recvQty = clamp(S.mobile.recvQty + +d.d, 1, 99); render(); },
  mRecvSaveQty: () => {
    const M = S.mobile, p = prod(M.recvPid), n = M.recvQty;
    p.stock += n; M.recvQty = 1; render();
    toast(`اتضاف ${num(n)} جهاز «${p.name}» للمخزون من غير IMEI`);
  },
  mRecvScan: () => { const M = S.mobile, im = DATA.makeImei(prod(M.recvPid).tac); M.recv.push(im); render(); toast(`اتمسح IMEI …${im.slice(-4)}`); },
  mRecvSave: () => {
    const M = S.mobile, p = prod(M.recvPid), today = new Date().toISOString().slice(0, 10);
    M.recv.forEach((im, i) => DATA.units.push({ imei: im, imei2: DATA.makeImei(p.tac), pid: p.id, color: p.colors[i % p.colors.length], storage: p.storage, condition: 'جديد', battery: null, customs: null, cost: p.cost, received: today, status: 'in' }));
    p.stock += M.recv.length;
    toast(`اتضاف ${num(M.recv.length)} جهاز «${p.name}» للمخزون`);
    M.recv = []; render();
  },
});

/* ===== تشغيل ===== */
S.mobile.recv = [DATA.makeImei(prod('p5').tac), DATA.makeImei(prod('p5').tac)];
applySettings();
render();
focusSearch();

</script>
