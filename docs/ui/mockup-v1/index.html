<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-font="plex" data-scale="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موبايل ستور — نموذج الواجهة</title>
<script>
  /* قبل الرسم: الوضع والخط والحجم واللون من الإعدادات المحفوظة — عشان مفيش وميض */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mshop.mockup.settings.v1') || '{}'), r = document.documentElement;
      r.dataset.theme = s.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (s.theme || 'light');
      if (s.font) r.dataset.font = s.font;
      if (s.scale) r.dataset.scale = s.scale;
      if (s.accent) r.style.setProperty('--accent', s.accent);
    } catch (e) { /* أول مرة */ }
  })();
</script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="pos.js"></script>
<script src="views.js"></script>
</body>
</html>
