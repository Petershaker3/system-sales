<!doctype html>
<html lang="ar" dir="rtl" data-theme="light" data-look="plate" data-font="auto" data-scale="normal">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>موبايل ستور — نموذج الواجهة</title>
<script>
  /* قبل الرسم: الطابع والوضع والخط والحجم واللون من الإعدادات المحفوظة، عشان مفيش وميض */
  (function () {
    try {
      var s = JSON.parse(localStorage.getItem('mshop.mockup.settings.v1') || '{}'), r = document.documentElement;
      if (!('look' in s)) { if (s.font === 'plex') delete s.font; if (String(s.accent || '').toLowerCase() === '#2563eb') delete s.accent; }
      if (s.look === 'plate' || s.look === 'box') r.dataset.look = s.look;
      r.dataset.theme = s.theme === 'auto' ? (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light') : (s.theme || 'light');
      if (s.font) r.dataset.font = s.font;
      if (s.scale) r.dataset.scale = s.scale;
      if (s.accent) r.style.setProperty('--accent', s.accent);
    } catch (e) { /* أول مرة */ }
  })();
</script>
<link rel="stylesheet" href="fonts.css">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="app"></div>
<div id="toasts" aria-live="polite"></div>
<script src="icons.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
<script src="analytics.js"></script>
<script src="pos.js"></script>
<script src="views/reports.js"></script>
<script src="views/repairs.js"></script>
<script src="views/inventory.js"></script>
<script src="views/receive.js"></script>
<script src="views/catalog.js"></script>
<script src="views/shortages.js"></script>
<script src="views/settings.js"></script>
<script src="views/lock.js"></script>
<script src="views/mobile.js"></script>
<script src="views/sales.js"></script>
<script src="views/wallets.js"></script>
<script src="boot.js"></script>
</body>
</html>
