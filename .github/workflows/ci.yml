# Build and test on every push.
#
# Why this exists (2026-10-17): the agent sessions that write code for this
# repository have no access to crates.io, so Rust cannot be compiled there.
# GitHub's runners can. Every push now proves three things with a log anyone
# can open: the frontend type-checks and builds, the Rust code compiles, and the
# whole Rust test suite passes (`AGENTS.md`: no claim without a recorded log).
#
# Minutes: the two Linux jobs run on every push. The Windows job (the real
# target, 2x minutes) runs only when the commit message contains `[windows]`
# or when started by hand, and it also builds the installer the owner can try.

name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # The compiler pinned in rust-toolchain.toml. Set here so rustup does not
  # also download the Android and Windows standard libraries on Linux.
  RUST_VERSION: '1.98.1'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  web:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

  rust:
    name: Rust (cargo test, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v4
      - name: System libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Frontend assets (Tauri embeds dist/)
        run: npm ci && npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast 2>&1 | tee ../cargo-test.log; exit ${PIPESTATUS[0]}
      - name: Test summary
        if: always()
        run: |
          echo '### cargo test' >> "$GITHUB_STEP_SUMMARY"
          grep -E '^test result:|Running ' cargo-test.log | sed 's/^/    /' >> "$GITHUB_STEP_SUMMARY" || true

  windows:
    name: Windows (cargo test + installer)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v4
      - name: Rust ${{ env.RUST_VERSION }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast
      - name: Installer (NSIS)
        run: npx tauri build --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-shop-system-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30
