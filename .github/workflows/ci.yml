# Build and test on every push.
#
# Why this exists (2026-10-17): the agent sessions that write code for this
# repository have no access to crates.io, so Rust cannot be compiled there.
# GitHub's runners can. Every push now proves three things with a log anyone
# can open: the frontend type-checks and builds, the Rust code compiles, and the
# whole Rust test suite passes (`AGENTS.md`: no claim without a recorded log).
#
# Minutes: the two Linux jobs run on every push. The Windows installer job and
# the Android APK job run when the commit message contains `[windows]`,
# `[android]`, or `[release]`, or when started via `workflow_dispatch`, and
# automatically publish the latest `.exe` and `.apk` to GitHub Releases.

name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The compiler pinned in rust-toolchain.toml. Set here so rustup does not
  # also download the Android and Windows standard libraries on Linux.
  RUST_VERSION: '1.98.1'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  web:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (vue-tsc)
        run: npm run typecheck 2>&1 | tee web.log; exit ${PIPESTATUS[0]}
      - name: Unit tests (node --test)
        run: npm run -s test:unit 2>&1 | tee -a web.log; exit ${PIPESTATUS[0]}
      - name: Build (vite)
        run: npx vite build 2>&1 | tee -a web.log; exit ${PIPESTATUS[0]}
      - name: Annotate
        if: always()
        run: node scripts/ci-annotate.mjs web.log frontend

  rust:
    name: Rust (cargo test, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v5
      - name: System libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Frontend assets (Tauri embeds dist/)
        run: npm ci && npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast 2>&1 | tee ../cargo-test.log; exit ${PIPESTATUS[0]}
      - name: Annotate
        if: always()
        run: node scripts/ci-annotate.mjs cargo-test.log 'cargo test linux'

  windows:
    name: Windows (cargo test + installer)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v5
      - name: Rust ${{ env.RUST_VERSION }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: cargo test --locked --no-fail-fast 2>&1 | tee ../cargo-test.log; exit ${PIPESTATUS[0]}
      - name: Installer (NSIS)
        shell: bash
        run: npx tauri build --bundles nsis 2>&1 | tee installer.log; exit ${PIPESTATUS[0]}
      - name: Annotate
        if: always()
        shell: bash
        run: |
          node scripts/ci-annotate.mjs cargo-test.log 'cargo test windows'
          if [ -f installer.log ]; then node scripts/ci-annotate.mjs installer.log installer; fi
          ls src-tauri/target/release/bundle/nsis/ 2>/dev/null | sed 's/^/::notice title=installer::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-shop-system-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (APK aarch64)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]') || contains(github.event.head_commit.message, '[windows]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v5
      - name: System libraries Tauri CLI links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Android NDK & SDK Platform
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=${ANDROID_HOME}/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Rust ${{ env.RUST_VERSION }} + aarch64-linux-android
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android --no-self-update
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        run: npm ci && npm run build
      - name: Init & build Android APK (aarch64)
        run: |
          npx tauri android init --ci
          npx tauri android build --debug --target aarch64 --apk 2>&1 | tee android.log; exit ${PIPESTATUS[0]}
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-shop-system-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Latest Release (.exe + .apk)
    needs: [windows, android]
    if: always() && (needs.windows.result == 'success' || needs.android.result == 'success')
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Publish to GitHub Release v1.0.0-latest
        run: |
          mkdir -p dist-release
          find release-assets -type f \( -name "*.exe" -o -name "*.apk" \) -exec cp -v {} dist-release/ \;
          ls -lh dist-release/
          git tag -f v1.0.0-latest "${{ github.sha }}"
          git push origin -f v1.0.0-latest
          if gh release view v1.0.0-latest >/dev/null 2>&1; then
            gh release upload v1.0.0-latest dist-release/* --clobber
          else
            gh release create v1.0.0-latest dist-release/* \
              --title "Mobile Shop System v1.0.0 (Windows .exe + Android .apk)" \
              --notes "Latest automated build of Mobile Shop System (Phases 1–4 + In-App System Guide) for Windows Desktop (.exe) and Android (.apk)."
          fi
