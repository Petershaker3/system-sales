# Build and test on every push.
#
# Why this exists (2026-10-17): the agent sessions that write code for this
# repository have no access to crates.io, so Rust cannot be compiled there.
# GitHub's runners can. Every push now proves three things with a log anyone
# can open: the frontend type-checks and builds, the Rust code compiles, and the
# whole Rust test suite passes (`AGENTS.md`: no claim without a recorded log).
#
# Minutes: the two Linux jobs run on every push. The Windows installer job and
# the Android APK job run when the commit message contains `[windows]`,
# `[android]`, or `[release]`, or when started via `workflow_dispatch`, and
# automatically publish the latest `.exe` and `.apk` to GitHub Releases.

name: CI

on:
  push:
    branches: ['main', 'arena/**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  # The compiler pinned in rust-toolchain.toml. Set here so rustup does not
  # also download the Android and Windows standard libraries on Linux.
  RUST_VERSION: '1.98.1'
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  web:
    name: Frontend (typecheck, build)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (vue-tsc)
        run: npm run typecheck 2>&1 | tee web.log; exit ${PIPESTATUS[0]}
      - name: Unit tests (node --test)
        run: npm run -s test:unit 2>&1 | tee -a web.log; exit ${PIPESTATUS[0]}
      - name: Build (vite)
        run: npx vite build 2>&1 | tee -a web.log; exit ${PIPESTATUS[0]}
      - name: Annotate
        if: always()
        run: node scripts/ci-annotate.mjs web.log frontend

  rust:
    name: Rust (cargo test, Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v5
      - name: System libraries Tauri links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - name: Rust ${{ env.RUST_VERSION }}
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Frontend assets (Tauri embeds dist/)
        run: npm ci && npm run build
      - name: cargo test
        working-directory: src-tauri
        run: cargo test --locked --no-fail-fast 2>&1 | tee ../cargo-test.log; exit ${PIPESTATUS[0]}
      - name: Annotate
        if: always()
        run: node scripts/ci-annotate.mjs cargo-test.log 'cargo test linux'

  windows:
    name: Windows (cargo test + installer)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[windows]') || contains(github.event.head_commit.message, '[release]')
    runs-on: windows-2022
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v5
      - name: Rust ${{ env.RUST_VERSION }}
        shell: bash
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --no-self-update
          rustc --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: cargo test
        working-directory: src-tauri
        shell: bash
        run: cargo test --locked --no-fail-fast 2>&1 | tee ../cargo-test.log; exit ${PIPESTATUS[0]}
      - name: Installer (NSIS)
        shell: bash
        run: npx tauri build --bundles nsis 2>&1 | tee installer.log; exit ${PIPESTATUS[0]}
      - name: Annotate
        if: always()
        shell: bash
        run: |
          node scripts/ci-annotate.mjs cargo-test.log 'cargo test windows'
          if [ -f installer.log ]; then node scripts/ci-annotate.mjs installer.log installer; fi
          ls src-tauri/target/release/bundle/nsis/ 2>/dev/null | sed 's/^/::notice title=installer::/' || true
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-shop-system-windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 30

  android:
    name: Android (APK aarch64)
    if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[android]') || contains(github.event.head_commit.message, '[windows]') || contains(github.event.head_commit.message, '[release]')
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      RUSTUP_TOOLCHAIN: '1.98.1'
    steps:
      - uses: actions/checkout@v5
      - name: System libraries Tauri CLI links against
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev libxdo-dev libssl-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Android NDK & SDK Platform
        run: |
          export ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          export ANDROID_SDK_ROOT="$ANDROID_HOME"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" --install "ndk;28.2.13676358" "platforms;android-35" "build-tools;35.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
          echo "NDK_HOME=$ANDROID_HOME/ndk/28.2.13676358" >> "$GITHUB_ENV"
      - name: Rust ${{ env.RUST_VERSION }} + aarch64-linux-android
        run: |
          rustup toolchain install "$RUST_VERSION" --profile minimal --target aarch64-linux-android --no-self-update
          rustc --version
          cargo --version
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Build frontend
        run: npm ci && npm run build
      - name: Init & build Android APK (aarch64)
        run: |
          npx tauri android init --ci 2>&1 | tee android.log
          # The generated manifest has no camera: a WebView without the declared
          # runtime permission cannot open it, whatever the web code asks for.
          node scripts/android-camera-permission.mjs 2>&1 | tee -a android.log
          npx tauri android build --debug --target aarch64 --apk 2>&1 | tee -a android.log; exit ${PIPESTATUS[0]}
      - name: Annotate Android build
        if: always()
        run: |
          if [ -f android.log ]; then node scripts/ci-annotate.mjs android.log 'android apk'; fi
          find src-tauri/gen/android/app/build/outputs/apk -name "*.apk" 2>/dev/null | sed 's/^/::notice title=apk::/' || true
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mobile-shop-system-android-apk
          path: src-tauri/gen/android/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 30

  release:
    name: Publish Latest Release (.exe + .apk)
    needs: [windows, android]
    # Both halves, or nothing: uploading a fresh APK beside yesterday's installer
    # would publish a pair that never existed together.
    if: always() && needs.windows.result == 'success' && needs.android.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v5
      - name: Download built artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-assets
      - name: Name both files after the version they were built from
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./src-tauri/tauri.conf.json').version")
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          mkdir -p dist-release
          EXE="Mobile.Shop.System_${VERSION}_x64-setup.exe"
          APK="Mobile.Shop.System_${VERSION}_arm64.apk"
          cp "$(find release-assets -type f -name '*.exe' | head -n1)" "dist-release/$EXE"
          cp "$(find release-assets -type f -name '*.apk' | head -n1)" "dist-release/$APK"
          ( cd dist-release && sha256sum "$EXE" "$APK" > SHA256SUMS.txt )
          {
            echo "commit:   ${{ github.sha }}"
            echo "branch:   ${{ github.ref_name }}"
            echo "run:      ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
            echo "built:    $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo
            ( cd dist-release && ls -lh "$EXE" "$APK" )
          } > dist-release/BUILD-INFO.txt
          ls -lh dist-release/
      - name: Publish to GitHub Release v1.0.0-latest
        run: |
          set -euo pipefail
          sed "s/__VERSION__/${VERSION}/g" .github/release-notes.md > /tmp/release-notes.md
          git tag -f v1.0.0-latest "${{ github.sha }}"
          git push origin -f v1.0.0-latest
          if gh release view v1.0.0-latest >/dev/null 2>&1; then
            # The description is re-read from the repository on every build, so the
            # download page cannot drift away from what the files actually are.
            gh release edit v1.0.0-latest \
              --title "Mobile Shop System v${VERSION} (Windows .exe + Android .apk)" \
              --notes-file /tmp/release-notes.md
            # An old build's file under an old name would sit beside the new one and
            # be downloaded by mistake.
            gh release view v1.0.0-latest --json assets --jq '.assets[].name' \
              | grep -E '\.(exe|apk)$' \
              | grep -vxE "Mobile\.Shop\.System_${VERSION}_x64-setup\.exe|Mobile\.Shop\.System_${VERSION}_arm64\.apk" \
              | while read -r stale; do
                  echo "removing stale asset: $stale"
                  gh release delete-asset v1.0.0-latest "$stale" -y
                done || true
            gh release upload v1.0.0-latest dist-release/* --clobber
          else
            gh release create v1.0.0-latest dist-release/* \
              --title "Mobile Shop System v${VERSION} (Windows .exe + Android .apk)" \
              --notes-file /tmp/release-notes.md
          fi
